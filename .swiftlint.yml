disabled_rules:
  # Job.State / Job.Kind read better nested inside the job they describe.
  - nesting
  - shorthand_operator
  - type_body_length
  - large_tuple
  - redundant_discardable_let
  - trailing_comma
type_name:
  min_length: 1
line_length: 1000
identifier_name:
  min_length: 1
cyclomatic_complexity:
  warning: 20
  error: 30
function_body_length:
  warning: 100
  error: 150
excluded:
  - build
  - DerivedData
  - fixtures
  # One-shot generators run with `swift scripts/…`, not part of the app target.
  - scripts
file_length:
  warning: 700
  error: 1000
function_parameter_count:
  warning: 7
  error: 10
custom_rules:
  # ScreenAwake is the only writer: the flag is app-wide, and a reader and the transfer queue
  # each writing their own answer let the queue switch an open book's keep-awake off.
  idle_timer_has_one_owner:
    name: "Idle timer has one owner"
    regex: 'isIdleTimerDisabled\s*='
    excluded: 'Mango/Services/ScreenAwake\.swift'
    message: "Keep the screen on through ScreenAwake.shared.hold(_:_:) or .keepsScreenAwake(_:as:)."
    severity: error
