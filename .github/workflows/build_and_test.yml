name: Build and Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mango-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-mango-xcode-26.6-spm-${{ hashFiles('Mango.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build and test
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild test -project Mango.xcodeproj -scheme Mango \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee build-and-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mango-test-results
          path: |
            build/TestResults.xcresult
            build-and-test.log
          if-no-files-found: ignore
